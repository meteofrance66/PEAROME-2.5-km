name: Mise à jour PEAROME (probabilités)

on:
  schedule:
    # 1 run par jour (PEAROME 09Z), à une heure différente des autres modèles.
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Reconstruire même si ce run est déjà publié
        type: boolean
        default: false
  # Pas de planification pour l'instant : lancement à la main (workflow_dispatch).

permissions:
  contents: write

concurrency:
  group: update-pearome
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Le quota Météo-France est partagé avec AROME : un passage peut attendre longtemps (et reprendre via le cache).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Vérifier le code
        run: python -m unittest discover -s tests

      - name: Reprendre les produits déjà récupérés (run en cours)
        uses: actions/cache/restore@v4
        with:
          path: .cache/pearome
          key: pearome-${{ github.run_id }}
          restore-keys: pearome-

      - name: Récupérer les probabilités PEAROME
        env:
          METEOFRANCE_PAQUET_API_KEY: ${{ secrets.METEOFRANCE_PAQUET_API_KEY }}
          FORCE: ${{ inputs.force }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$METEOFRANCE_PAQUET_API_KEY" ]; then
            echo "::warning title=Secret manquant::Ajoutez METEOFRANCE_PAQUET_API_KEY dans Settings > Secrets and variables > Actions pour activer PEAROME."
            exit 0
          fi
          args=()
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_pearome.py \
              --output-dir build/pearome \
              --current-index-url "https://raw.githubusercontent.com/$REPOSITORY/data/index.json" \
              "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Conserver les produits récupérés (même en cas d'arrêt)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/pearome
          key: pearome-${{ github.run_id }}

      - name: Publier sur la branche data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build/pearome/index.json ]; then
            echo "Rien de nouveau à publier."
            exit 0
          fi
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          root = Path("build/pearome")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          assert index["status"] == "ok"
          assert index["products"], "aucun produit"
          for product in index["products"]:
              assert (root / product["file"]).is_file(), product["file"]
          print("Validation OK :", len(index["products"]), "produits, run", index["run_time"])
          # Valeurs aux communes de toute la France (sans carte) : présentes quand le recadrage a été vérifié.
          dossier = root / "departements"
          if dossier.is_dir():
              fichiers = sorted(dossier.glob("*.json"))
              assert len(fichiers) == len(index["departments"]) >= 90, f"{len(fichiers)} départements"
              communes = 0
              for f in fichiers:
                  d = json.loads(f.read_text(encoding="utf-8"))
                  assert d["run_time"] == index["run_time"] and d["products"], f.name
                  communes += len(d["communes"])
                  for produit in d["products"]:
                      assert produit["steps"], f.name
                      for etape in produit["steps"]:
                          assert len(base64.b64decode(etape["data"])) == len(d["communes"]), f"{f.name} {produit['id']}"
              assert communes == index["coverage"]["communes"] > 34000, communes
              print("Validation OK :", communes, "communes,", len(fichiers), "départements")
          else:
              print("::warning::Pas de valeurs aux communes sur ce passage (recadrage non vérifié ou mode sans France).")
          PY
          publish_dir="$(mktemp -d)"
          cp -R build/pearome/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git init -q -b data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -q -m "PEAROME $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Branche de publication écrasée à chaque run : seul le dernier run est utile, pas d'historique à garder.
          git -C "$publish_dir" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
          echo "Prévisions publiées dans https://github.com/${GITHUB_REPOSITORY}/tree/data" >> "$GITHUB_STEP_SUMMARY"
